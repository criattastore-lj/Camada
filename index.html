<style>
/* Layout: painel de oficina — menu lateral fixo, área de trabalho com cartões de leitura rápida e tabelas operáveis. */
:root {
  --bg: #F1F3F6; --surface: #FFFFFF; --surface-2: #F7F8FA; --ink: #141821; --muted: #5B6375; --line: #DCE0E7;
  --accent: #2F4BFF; --accent-ink: #FFFFFF; --accent-soft: #E6EAFF;
  --good: #1D7A50; --good-soft: #E1F3EA; --warn: #A15C00; --warn-soft: #FFF1DC; --bad: #B3261E; --bad-soft: #FDE7E5;
  --chart-a: #2F4BFF; --chart-b: #AEB5C3; --chart-c: #F26B2A;
  --f-display: 'Chakra Petch', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1116; --surface: #171A21; --surface-2: #1C2029; --ink: #E7EAF0; --muted: #9AA2B3; --line: #2A2F3A;
    --accent: #7C8FFF; --accent-ink: #0F1116; --accent-soft: #1E2545;
    --good: #5FD39C; --good-soft: #15291F; --warn: #F2B35A; --warn-soft: #2E2312; --bad: #FF8A80; --bad-soft: #341716;
    --chart-a: #7C8FFF; --chart-b: #4A5163; --chart-c: #FF8A4C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1116; --surface: #171A21; --surface-2: #1C2029; --ink: #E7EAF0; --muted: #9AA2B3; --line: #2A2F3A;
  --accent: #7C8FFF; --accent-ink: #0F1116; --accent-soft: #1E2545;
  --good: #5FD39C; --good-soft: #15291F; --warn: #F2B35A; --warn-soft: #2E2312; --bad: #FF8A80; --bad-soft: #341716;
  --chart-a: #7C8FFF; --chart-b: #4A5163; --chart-c: #FF8A4C; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-family: var(--f-display); font-size: 26px; font-weight: 700; letter-spacing: .01em; }
h2 { font-size: 16px; font-weight: 600; }
.app { display: flex; min-height: 100vh; }
.side { width: 220px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.logo-mark { width: 26px; height: 26px; display: grid; grid-template-rows: repeat(5, 1fr); gap: 2px; }
.logo-mark span { background: var(--accent); border-radius: 2px; }
.logo-mark span:nth-child(1) { width: 40%; justify-self: center; } .logo-mark span:nth-child(2) { width: 70%; justify-self: center; } .logo-mark span:nth-child(4) { width: 85%; justify-self: center; }
.logo b { font-family: var(--f-display); font-size: 18px; } .logo small { display: block; font-family: var(--f-mono); font-size: 10px; color: var(--muted); margin-top: -3px; }
.nav-btn { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); text-align: left; font-weight: 500; }
.nav-btn:hover { color: var(--ink); background: var(--surface-2); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav-btn .dot { min-width: 20px; height: 20px; border-radius: 999px; font-size: 11px; display: inline-grid; place-items: center; font-family: var(--f-mono); padding: 0 6px; }
.dot.bad { background: var(--bad); color: #fff; } .dot.warn { background: var(--warn); color: #fff; }
.mode { margin-top: auto; font-size: 12px; color: var(--muted); padding: 10px; border-top: 1px solid var(--line); }
main { flex: 1; min-width: 0; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; font-weight: 500; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.card > h2 + * { margin-top: 12px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.kpi > span { font-size: 12px; color: var(--muted); }
.kpi b { font-family: var(--f-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi > small { font-size: 12px; color: var(--muted); }
.kpi.hero { border-color: var(--accent); }
.pos { color: var(--good); } .neg { color: var(--bad); }
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); flex-wrap: wrap; }
.alert.bad { border-color: var(--bad); background: var(--bad-soft); } .alert.warn { border-color: var(--warn); background: var(--warn-soft); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; } td.num { white-space: nowrap; }
.sw { width: 16px; height: 16px; border-radius: 999px; border: 1px solid var(--line); display: inline-block; vertical-align: middle; flex-shrink: 0; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty b { color: var(--ink); font-size: 15px; }
.prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.prod { display: flex; flex-direction: column; gap: 12px; }
.prod-top { display: flex; gap: 12px; align-items: flex-start; }
.thumb { width: 84px; height: 84px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); object-fit: cover; flex-shrink: 0; display: grid; place-items: center; color: var(--muted); font-size: 11px; text-align: center; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--muted); } .kv span:nth-child(even) { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.kv .total { color: var(--ink) !important; font-weight: 600; border-top: 1px solid var(--line); padding-top: 4px; }
.chan { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.chan div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; }
.chan small { font-size: 11px; color: var(--muted); }
.chan b { font-family: var(--f-mono); font-size: 16px; font-weight: 500; }
.chan em { font-style: normal; font-size: 11px; color: var(--good); font-family: var(--f-mono); }
.margin-in { width: 64px; min-height: 30px; border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; background: var(--surface); text-align: right; font-family: var(--f-mono); }
dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--surface); color: var(--ink); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(10, 12, 16, .5); }
dialog form { display: flex; flex-direction: column; gap: 12px; padding: 20px; }
.dlg-head { display: flex; justify-content: space-between; align-items: center; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
.in { width: 100%; min-height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: var(--surface-2); }
textarea.in { padding: 8px 10px; min-height: 64px; }
.in:focus { border-color: var(--accent); outline: none; }
.fg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fg3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.fil-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 90px 36px; gap: 8px; align-items: center; }
.deal-price { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; align-items: baseline; }
.color-avail table { font-size: 12px; min-width: 0; width: 100%; } .color-avail td, .color-avail th { padding: 6px 6px; white-space: normal; } .color-avail th { line-height: 1.2; }
@media (max-width: 560px) { .color-avail td, .color-avail th { padding: 5px 3px; font-size: 11px; } .color-avail .btn.sm { padding: 0 8px; min-height: 30px; } .color-avail .pill { font-size: 10px; padding: 2px 5px; } } .color-avail tr.cur td { background: var(--accent-soft, rgba(80,90,255,.08)); }
.client-total { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding-bottom: 10px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.client-total b { font-family: 'Chakra Petch', sans-serif; font-size: 24px; } .client-total small { flex-basis: 100%; color: var(--muted); }
dialog.wide { width: min(800px, calc(100vw - 32px)); }
.seg { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; flex-wrap: wrap; }
.seg button { flex: 1 1 140px; min-height: 38px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.sec-t { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; border-top: 1px solid var(--line); padding-top: 12px; }
.deal-item { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); }
.deal-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.deal-top .thumb { width: 56px; height: 56px; }
.deal-top select { flex: 1 1 180px; min-width: 0; width: auto; }
.deal-top .q { width: 72px; } .deal-top .pr { width: 112px; }
.deal-info { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.color-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) 92px; gap: 8px; align-items: center; font-size: 12px; }
.color-row select { min-height: 34px; font-size: 13px; }
@media (max-width: 560px) { .color-row { grid-template-columns: minmax(0, 1fr); } .fil-row { grid-template-columns: minmax(0, 1fr) 80px 36px; } .fil-row .part { grid-column: 1 / -1; } }
.ord-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 108px 36px; gap: 6px; align-items: center; }
.plan-row { display: grid; grid-template-columns: minmax(0, 1fr) 100px 140px 36px; gap: 8px; align-items: center; }
.x { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.thumb img[data-photo] { cursor: zoom-in; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
#lb { width: min(920px, calc(100vw - 24px)); max-height: calc(100vh - 24px); padding: 0; }
.lb-wrap { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
.lb-img { background: #111; display: grid; place-items: center; min-height: 280px; }
.lb-img img { width: 100%; height: 100%; max-height: 80vh; object-fit: contain; display: block; }
.lb-side { padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.lb-side textarea { min-height: 120px; resize: vertical; font: inherit; }
@media (max-width: 700px) { .lb-wrap { grid-template-columns: minmax(0, 1fr); } .lb-img img { max-height: 46vh; } }
.notif { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); border-left: 4px solid var(--line); }
.notif.good { border-left-color: var(--good, #1a9b5b); } .notif.warn { border-left-color: var(--warn, #c98a00); } .notif.bad { border-left-color: var(--bad, #d13c3c); }
.notif-b { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.notif-b b { font-size: 14px; } .notif-b .row { margin-top: 6px; gap: 6px; }
.notif .thumb { width: 48px; height: 48px; }
.notifs { display: flex; flex-direction: column; gap: 10px; }
.chat { display: flex; flex-direction: column; gap: 12px; }
.msgs { display: flex; flex-direction: column; gap: 10px; max-height: 58vh; overflow-y: auto; padding: 4px; }
.msg { align-self: flex-start; max-width: min(560px, 92%); background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px 12px 12px 4px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.msg.me { align-self: flex-end; border-radius: 12px 12px 4px 12px; background: var(--accent-soft, rgba(80,90,255,.10)); }
.msg.auto { align-self: center; background: transparent; border-style: dashed; max-width: 100%; }
.msg-h { font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.msg-h b { color: var(--ink); font-size: 12px; }
.msg-b { font-size: 14px; white-space: normal; overflow-wrap: anywhere; }
.composer { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.composer textarea { min-height: 64px; resize: vertical; font: inherit; }
.composer .row select { width: auto; flex: 1 1 150px; min-width: 0; }
.who { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; padding: 10px 8px 0; border-top: 1px solid var(--line); margin-top: 8px; }
.who select { min-height: 32px; font-size: 12px; }
body.auth .side { display: none; }
.login { margin-top: 8vh; } .login .logo { margin: 0; padding: 0; display: flex !important; }
.onboard { max-width: 520px; margin: 40px auto; display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 860px) { .who { display: none; } }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 50; font-size: 13px; max-width: calc(100vw - 32px); }
.banner { padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); font-size: 13px; }
.mtask { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mtask:last-child { border-bottom: 0; }
.mtask small { display: block; color: var(--muted); font-size: 12px; }
@media (max-width: 860px) {
  .app { flex-direction: column; }
  .side { width: auto; height: auto; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; flex-direction: row; overflow-x: auto; padding: 8px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); border-right: 0; border-bottom: 1px solid var(--line); gap: 4px; }
  .logo, .mode { display: none; }
  .nav-btn { white-space: nowrap; flex-shrink: 0; }
  .g2, .g3 { grid-template-columns: minmax(0, 1fr); }
  .fg3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .plan-row { grid-template-columns: minmax(0, 1fr) 80px 36px; }
  .plan-row .plan-max { grid-column: 1 / -1; }
}
@media (max-width: 420px) { .fg { grid-template-columns: minmax(0, 1fr); } .chan { grid-template-columns: minmax(0, 1fr); } }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>

<script src="js/supabase.js"></script>

<body>


<div class="app">
  <nav class="side" id="nav" aria-label="Seções">
    <div class="logo"><span class="logo-mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span><span><b>camada</b><small>operações</small></span></div>
  </nav>
  <main><div class="wrap" id="view"><div class="empty"><b>Carregando…</b></div></div></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';
  // ================= Utilidades =================
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const brl = (n) => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        else { const url = await blobToDataUrl(await shrink(file, 420)); p.photoId = url; $('#ph-prev').innerHTML = '<img src="' + url + '" alt="">'; }
        $('#ph-status').textContent = 'Foto pronta. Salve o produto.';
      } catch (e) { $('#ph-status').textContent = e && e.code === 'too_large' ? 'Foto grande demais.' : 'Não foi possível enviar a foto.'; }
    };
  }
  function shrink(file, max) {
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob((b) => (b ? res(b) : rej(new Error('img'))), 'image/jpeg', 0.85); };
      img.onerror = () => rej(new Error('img')); img.src = url;
    });
  }
  const blobToDataUrl = (b) => new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });

    return { gross, fees, commission, ship, net, cost, profit: net - cost, comm };

      f('a-pack', 'Embalagem padrão (R$)', st.packaging) + f('a-margin', 'Margem de lucro padrão (%)', st.margin, 'Sobre o preço de venda.') + f('a-cpg', 'Custo por grama sem compra lançada (R$)', st.defaultCpg) + '</div></div>' +
      '<div class="card"><h2>Mercado Livre (Clássico)</h2><div class="fg3" style="margin-top:12px">' + f('ml-pct', 'Comissão (%)', st.ml.pct, 'Varia de 10% a 14% por categoria.') + f('ml-fix', 'Taxa fixa abaixo do limite (R$)', st.ml.fixedUnder) + f('ml-thr', 'Limite do frete grátis (R$)', st.ml.threshold) + f('ml-ship', 'Frete grátis pago por você, estimado (R$)', st.ml.freeShip, 'Confira no simulador do ML.') + '</div></div>' +
      '<div class="card"><h2>Shopee</h2><div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Até (R$)</th><th>Comissão (%)</th><th>Fixo (R$)</th></tr></thead><tbody>' + st.shopee.tiers.map((t, i) => '<tr><td class="num">' + (t.upTo >= 1e8 ? 'acima' : '<input class="in num" data-tier="' + i + '" data-tk="upTo" value="' + n1(t.upTo, 2) + '" aria-label="Faixa até">') + '</td><td><input class="in num" data-tier="' + i + '" data-tk="pct" value="' + n1(t.pct, 2) + '" aria-label="Comissão"></td><td><input class="in num" data-tier="' + i + '" data-tk="fixed" value="' + n1(t.fixed, 2) + '" aria-label="Fixo"></td></tr>').join('') + '</tbody></table></div><p class="hint">Valores de out/2026 para CNPJ e CPF até 450 pedidos em 90 dias.</p></div>' +
      '<div class="card"><h2>TikTok Shop</h2><div class="fg3" style="margin-top:12px">' + f('tt-under', 'Limite da faixa (R$)', st.tiktok.under) + f('tt-pu', 'Comissão abaixo (%)', st.tiktok.pctUnder) + f('tt-fu', 'Fixo abaixo (R$)', st.tiktok.fixedUnder) + f('tt-po', 'Comissão acima (%)', st.tiktok.pctOver) + f('tt-fo', 'Fixo acima (R$)', st.tiktok.fixedOver) + f('tt-sp', 'Programa de frete (%)', st.tiktok.shipPct) + '</div><label class="row" style="margin-top:10px"><input type="checkbox" id="tt-ship"' + (st.tiktok.shipProgram ? ' checked' : '') + '> Participo do programa de taxas de envio (limite de ' + brl(st.tiktok.shipCap) + ' por produto)</label></div>' +
      '<div class="card"><h2>Instagram, site e vendedores</h2><div class="fg3" style="margin-top:12px">' + f('ig-pay', 'Instagram: taxa de pagamento (%)', st.instagram.payPct, 'Pix 0%; link ou maquininha de cartão costuma cobrar de 3% a 5%.') + f('ig-fix', 'Instagram: valor fixo por item (R$)', st.instagram.fixed) + f('st-pay', 'Site: taxa do meio de pagamento (%)', st.site.payPct, 'Ex.: gateway de cartão e Pix do site.') + f('st-fix', 'Site: valor fixo por item (R$)', st.site.fixed) + f('vd-pay', 'Vendedor: taxa de pagamento (%)', st.vendedor.payPct) + f('vd-comm', 'Comissão padrão de vendedor (%)', st.vendedor.commission, 'Usada no preço sugerido. Cada vendedor pode ter a sua.') + '</div></div>' +
      '<div class="row"><button class="btn primary" type="submit">Salvar ajustes</button><button class="btn" type="button" id="cfg-reset">Voltar aos valores padrão</button></div></form>';
    return h;
  }
  document.addEventListener('submit', async (e) => {
    if (e.target.id !== 'cfg') return; e.preventDefault();
    const v = (id) => num($('#' + id).value), st = set();
    const tiers = st.shopee.tiers.map((t, i) => ({ upTo: t.upTo >= 1e8 ? 1e9 : num(($('[data-tier="' + i + '"][data-tk="upTo"]') || {}).value), pct: num($('[data-tier="' + i + '"][data-tk="pct"]').value), fixed: num($('[data-tier="' + i + '"][data-tk="fixed"]').value) }));
    await saveSettings({ kwh: v('a-kwh'), helperHour: v('a-help'), failPct: v('a-fail'), packaging: v('a-pack'), margin: v('a-margin'), defaultCpg: v('a-cpg'),
      ml: { pct: v('ml-pct'), fixedUnder: v('ml-fix'), threshold: v('ml-thr'), freeShip: v('ml-ship') }, shopee: { tiers },
      tiktok: { under: v('tt-under'), pctUnder: v('tt-pu'), fixedUnder: v('tt-fu'), pctOver: v('tt-po'), fixedOver: v('tt-fo'), shipPct: v('tt-sp'), shipCap: st.tiktok.shipCap, shipProgram: $('#tt-ship').checked },
      instagram: { payPct: v('ig-pay'), fixed: v('ig-fix') }, site: { payPct: v('st-pay'), fixed: v('st-fix') }, vendedor: { payPct: v('vd-pay'), fixed: 0, commission: v('vd-comm') } });
    toast('Ajustes salvos');
  });

  // ================= Diálogos =================
  function openDlg(title, body, onSave) {
    const d = $('#dlg'); d.classList.remove('wide');
    dealCtx = null;
    d.innerHTML = '<form method="dialog" id="dlg-form"><div class="dlg-head"><h2>' + title + '</h2><button type="button" class="x" id="dlg-x" aria-label="Fechar">✕</button></div>' + body + '<div class="row" style="justify-content:flex-end;margin-top:4px"><button type="button" class="btn" id="dlg-cancel">Cancelar</button><button type="submit" class="btn primary" id="dlg-ok">Salvar</button></div></form>';
    const close = () => { d.close(); scheduleRender(); };
    $('#dlg-x').onclick = close; $('#dlg-cancel').onclick = close;
    $('#dlg-form').onsubmit = async (e) => {
      e.preventDefault(); const b = $('#dlg-ok'); b.disabled = true;
      try { const ok = await onSave(); if (ok !== false) close(); } catch (er) { } finally { b.disabled = false; }
    };
    d.showModal();
    const first = d.querySelector('input:not([type=file]):not([type=color]), select'); if (first) first.focus();
  }
  function confirmDlg(title, text, okLabel) {
    return new Promise((res) => {
      const d = $('#dlg'); const wasOpen = d.open; const prev = wasOpen ? d.innerHTML : null;
      const box = document.createElement('dialog'); document.body.appendChild(box);
      box.innerHTML = '<form method="dialog" style="display:flex;flex-direction:column;gap:12px;padding:20px"><h2>' + esc(title) + '</h2>' + (text ? '<p class="hint" style="font-size:13px">' + esc(text) + '</p>' : '') + '<div class="row" style="justify-content:flex-end"><button class="btn" value="no">Cancelar</button><button class="btn primary" value="yes">' + esc(okLabel || 'Confirmar') + '</button></div></form>';
      box.addEventListener('close', () => { res(box.returnValue === 'yes'); box.remove(); if (d.open) {} else scheduleRender(); });
      box.showModal();
    });
  }

  // ================= Ações =================
  document.addEventListener('click', async (e) => {
    const t = e.target.closest('button, a'); if (!t) return;
    const ds = t.dataset;
    if (ds.go) { e.preventDefault(); go(ds.go); return; }
    if (ds.new === 'product') return productDialog();
    if (ds.new === 'filament') return filamentDialog();
    if (ds.new === 'purchase') return purchaseDialog();
    if (ds.buy) return purchaseDialog(ds.buy, +ds.rolls || 1);
    if (ds.adjust) return adjustDialog(ds.adjust);
    if (ds.new === 'adjust') return adjustDialog();
    if (ds.new === 'loss') return lossDialog();
    if (ds.new === 'machine') return machineDialog();
    if (ds.new === 'sale') return saleDialog();
    if (ds.new === 'expense') return expenseDialog();
    if (ds.new === 'order') return orderDialog(null, 'encomenda');
    if (ds.new === 'lead') return orderDialog(null, 'lead');
    if (ds.new === 'seller') return sellerDialog();
    if (ds.editOrder) return orderDialog(byId('orders', ds.editOrder));
    if (ds.editSeller) return sellerDialog(byId('sellers', ds.editSeller));
    if (ds.ofilter) { orderFilter = ds.ofilter; render(); return; }
    if (ds.deliver) { const o = byId('orders', ds.deliver); if (o && await confirmDlg('Marcar a encomenda de ' + o.client + ' como entregue?', 'A venda é lançada em Vendas com taxa do canal e comissão.', 'Entregar e lançar venda')) await deliverOrder(o); return; }
    if (ds.msgOrder) { const o = byId('orders', ds.msgOrder); msgDraft = { text: msgDraft.text, orderId: ds.msgOrder, to: myRole() === 'producao' ? 'vendas' : myRole() === 'vendas' ? 'producao' : 'todos' }; go('mensagens'); setTimeout(() => { const t = $('#msg-text'); if (t) t.focus(); }, 50); return; }
    if (t.id === 'msg-send') { const text = ($('#msg-text').value || '').trim(); if (!text) { toast('Escreva a mensagem'); return; } t.disabled = true; try { await saveDoc('messages', { authorId: ME.id, role: myRole(), to: $('#msg-to').value, orderId: $('#msg-order').value, text, createdAt: Date.now() }); msgDraft = { text: '', to: $('#msg-to').value, orderId: '' }; lastMsgSeen = Date.now(); saveSeen(); render(); } catch (er) { t.disabled = false; } return; }
    if (ds.obrole) { obRole = ds.obrole; if (mode === 'login') { const keep = {}; ['l-nick', 'l-email', 'l-pass'].forEach((k) => { const x = $('#' + k); if (x) keep[k] = x.value; }); render(); Object.keys(keep).forEach((k) => { const x = $('#' + k); if (x) x.value = keep[k]; }); } else render(); return; }
    if (ds.auth) { authView = ds.auth; render(); return; }
    if (['l-login', 'l-signup', 'l-reset', 'l-newpass'].includes(t.id)) return authAction(t.id, t);
    if (ds.logout || t.id === 'l-logout') return logout();
    if (ds.install) { if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch (er) {} installEvt = null; render(); } return; }
    if (t.id === 'bk-export') return exportBackup();
    if (t.id === 'bk-import') { const i = $('#bk-file'); if (i) i.click(); return; }
    if (ds.mapprove) { const m = S.members.find((x) => x.id === ds.mapprove); if (m) { await saveDoc('members', Object.assign({}, m, { approved: true })); toast(personName(m.id) + ' aprovado(a)'); postAuto('todos', personName(m.id) + ' entrou na equipe (' + ROLES[m.role] + ').'); } return; }
    if (t.id === 'ob-save') {
      const nick = ($('#ob-nick').value || '').trim(); if (!nick) { toast('Diga como quer ser chamado(a)'); return; }
      let sellerId = '';
      if (obRole === 'vendas' && mode !== 'cloud') { const ex = S.sellers.find((x) => x.name.trim().toLowerCase() === nick.toLowerCase()); sellerId = ex ? ex.id : (await saveDoc('sellers', { name: nick, commission: num(set().vendedor.commission), contact: '', active: true })).id; }
      await saveDoc('members', { id: ME.id, role: obRole, nick, sellerId, joinedAt: Date.now() });
      if (mode !== 'cloud') await postAuto('todos', nick + ' entrou na equipe (' + ROLES[obRole] + ').');
      view = obRole === 'vendas' ? 'encomendas' : 'avisos'; render(); return;
    }
    if (ds.mdel) { const m = S.members.find((x) => x.id === ds.mdel); if (m && await confirmDlg('Remover ' + personName(m.id) + ' da equipe?', 'A pessoa volta para a tela de escolher função. Para tirar o acesso de vez, remova também no menu Compartilhar.', 'Remover')) await delDoc('members', m.id); return; }
    if (ds.orderPlan) { const o = byId('orders', ds.orderPlan); if (o) { const al = allocOrders()[o.id]; plan = al ? al.items.filter((x) => x.make > 0).map((x) => ({ productId: x.p.id, qty: x.make, colors: x.colors, orderId: o.id })) : []; if (!plan.length) plan = [{ productId: '', qty: 1 }]; go('producao'); toast(plan[0] && plan[0].productId ? 'Peças que faltam da encomenda de ' + o.client + ' no planejamento' : 'Esta encomenda já tem todas as peças prontas'); } return; }
    if (ds.delOrder) { const o = byId('orders', ds.delOrder); if (o && await confirmDlg('Excluir a encomenda de ' + o.client + '?', o.billed ? 'As vendas já lançadas desta encomenda continuam em Vendas.' : '', 'Excluir')) await delDoc('orders', o.id); return; }
    if (ds.paySeller) { const x = byId('sellers', ds.paySeller); const due = S.sales.filter((s) => s.sellerId === ds.paySeller && !s.commissionPaid); const tot = due.reduce((a, s) => a + num(s.commission), 0); if (x && due.length && await confirmDlg('Registrar pagamento de ' + brl(tot) + ' para ' + x.name + '?', due.length + ' venda(s) com comissão em aberto serão marcadas como pagas.', 'Registrar pagamento')) { for (const s of due) await saveDoc('sales', Object.assign({}, s, { commissionPaid: true, commissionPaidAt: today() })); toast('Pagamento de comissão registrado'); } return; }
    if (ds.newTask) return taskDialog(null, ds.newTask);
    if (ds.editProduct) return productDialog(byId('products', ds.editProduct));
    if (ds.editFil) return filamentDialog(byId('filaments', ds.editFil));
    if (ds.editMachine) return machineDialog(byId('machines', ds.editMachine));
    if (ds.editTask) return taskDialog(byId('maintenance', ds.editTask));
    if (ds.sell) return saleDialog(ds.sell);
    if (ds.done) { const tk = byId('maintenance', ds.done); if (tk) { await saveDoc('maintenance', Object.assign({}, tk, { lastDate: today(), lastHours: Math.round(machineHours(tk.machineId) * 10) / 10 })); toast('Manutenção registrada'); } return; }
    if (ds.delProduct) { const p = byId('products', ds.delProduct); if (p && await confirmDlg('Excluir "' + p.name + '"?', 'Vendas e produções antigas continuam no histórico.', 'Excluir')) { await delDoc('products', p.id); if (p.photoId && mode === 'cloud' && String(p.photoId).includes('/fotos/')) { try { await sb.storage.from('fotos').remove([decodeURIComponent(String(p.photoId).split('/fotos/')[1])]); } catch (er) {} } else if (p.photoId && assets && !/^(data:|https?:)/.test(String(p.photoId))) { try { await assets.delete(p.photoId); } catch (er) {} } } return; }
    if (ds.delPur) { if (await confirmDlg('Excluir esta compra?', 'O estoque e o custo por grama serão recalculados.', 'Excluir')) await delDoc('purchases', ds.delPur); return; }
    if (ds.delProd) { if (await confirmDlg('Excluir este registro de produção?', 'O filamento volta para o estoque.', 'Excluir')) await delDoc('productions', ds.delProd); return; }
    if (ds.delSale) { if (await confirmDlg('Excluir esta venda?', '', 'Excluir')) await delDoc('sales', ds.delSale); return; }
    if (ds.delExp) { if (await confirmDlg('Excluir esta despesa?', '', 'Excluir')) await delDoc('expenses', ds.delExp); return; }
    if (t.id === 'plan-add') { plan.push({ productId: '', qty: 1 }); renderPlan(); return; }
    if (ds.prm !== undefined) { plan.splice(+ds.prm, 1); if (!plan.length) plan.push({ productId: '', qty: 1 }); renderPlan(); return; }
    if (t.id === 'plan-save') return savePlan();
    if (t.id === 'cfg-reset') { if (await confirmDlg('Voltar aos valores padrão?', 'Energia, ajudante, margem e taxas dos canais voltam aos valores iniciais.', 'Voltar ao padrão')) { await saveSettings(JSON.parse(JSON.stringify(DEFAULT_SETTINGS))); toast('Valores padrão restaurados'); render(); } return; }
  });

  render();
  boot();
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
